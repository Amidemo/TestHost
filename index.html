<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Милая Одевалка | Cute Dress-Up Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FFD1DC',
                            purple: '#E4C1F9',
                            blue: '#D0F4DE',
                            yellow: '#FDFCDC',
                            mint: '#C1FBA4',
                            peach: '#FFCBC1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .dark .glass-panel {
            background: rgba(30, 27, 45, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .wardrobe-tab {
            transition: all 0.25s ease;
        }
        .wardrobe-tab.active {
            background: linear-gradient(135deg, #FF758C 0%, #FF7EB3 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transform: translateY(-2px);
        }

        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-card:hover {
            transform: translateY(-4px) scale(1.03);
        }
        .item-card:active {
            transform: scale(0.95);
        }
        .item-card.selected {
            border-color: #FF758C;
            background-color: rgba(255, 117, 140, 0.15);
            box-shadow: 0 0 12px rgba(255, 117, 140, 0.4);
        }

        /* Custom scrollbar for wardrobe grid */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.03);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 117, 140, 0.4);
            border-radius: 4px;
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 dark:from-gray-900 dark:via-purple-950 dark:to-indigo-950 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <header class="w-full max-w-5xl mx-auto px-4 pt-4 pb-2 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-400 to-purple-500 flex items-center justify-center text-white shadow-lg text-2xl font-bold animate-bounce-gentle">
                👗
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-600 dark:from-pink-400 dark:to-purple-400">
                    Каваи Одевалка ✨
                </h1>
                <p class="text-xs text-gray-500 dark:text-gray-400">Создай свой неповторимый образ!</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="soundToggleBtn" title="Звук" class="p-3 rounded-2xl glass-panel hover:bg-white/90 transition shadow-sm text-gray-700 dark:text-gray-200">
                <i id="soundIcon" class="fas fa-volume-up text-base"></i>
            </button>
            <button id="themeToggleBtn" title="Сменить тему" class="p-3 rounded-2xl glass-panel hover:bg-white/90 transition shadow-sm text-gray-700 dark:text-gray-200">
                <i id="themeIcon" class="fas fa-moon text-base"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto px-4 my-auto py-3 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
        
        <!-- Left Column: Character Stage -->
        <div class="lg:col-span-5 flex flex-col items-center justify-center relative">
            
            <!-- Background glow / badge -->
            <div class="absolute w-64 h-64 md:w-72 md:h-72 bg-gradient-to-tr from-pink-300/40 to-purple-300/40 rounded-full blur-3xl pointer-events-none -z-10"></div>

            <!-- Avatar Container -->
            <div class="relative w-72 h-[380px] md:w-80 md:h-[420px] glass-panel rounded-3xl shadow-2xl flex items-center justify-center p-4 overflow-hidden border-2 border-white/80 dark:border-white/10">
                
                <!-- SVG Doll Canvas -->
                <svg id="avatarCanvas" viewBox="0 0 300 400" class="w-full h-full drop-shadow-md">
                    <!-- Layers will be dynamically injected via JavaScript -->
                </svg>

                <!-- Floating Action Buttons over stage -->
                <div class="absolute bottom-4 left-4 right-4 flex justify-between gap-2">
                    <button id="randomizeBtn" class="flex-1 py-2.5 px-3 bg-white/80 dark:bg-gray-800/80 hover:bg-white dark:hover:bg-gray-800 text-pink-600 dark:text-pink-400 font-semibold text-xs rounded-xl shadow-md backdrop-blur-md transition flex items-center justify-center gap-1.5 border border-pink-200/50">
                        <i class="fas fa-wand-magic-sparkles"></i> Случайно
                    </button>
                    <button id="resetBtn" class="py-2.5 px-3.5 bg-white/80 dark:bg-gray-800/80 hover:bg-white dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 font-semibold text-xs rounded-xl shadow-md backdrop-blur-md transition flex items-center justify-center gap-1.5 border border-gray-200/50" title="Сбросить наряд">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                    <button id="saveBtn" class="py-2.5 px-3.5 bg-gradient-to-r from-pink-500 to-purple-500 text-white font-semibold text-xs rounded-xl shadow-md hover:opacity-90 transition flex items-center justify-center gap-1.5">
                        <i class="fas fa-camera"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Wardrobe Panel -->
        <div class="lg:col-span-7 flex flex-col gap-4">
            
            <!-- Wardrobe Categories Navigation Tabs -->
            <div class="glass-panel p-2 rounded-2xl shadow-lg flex gap-1.5 overflow-x-auto">
                <button data-cat="hair" class="wardrobe-tab active flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fas fa-cut"></i> Волосы
                </button>
                <button data-cat="tops" class="wardrobe-tab flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap text-gray-600 dark:text-gray-300 hover:bg-white/50">
                    <i class="fas fa-shirt"></i> Верх
                </button>
                <button data-cat="bottoms" class="wardrobe-tab flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap text-gray-600 dark:text-gray-300 hover:bg-white/50">
                    <i class="fas fa-socks"></i> Низ
                </button>
                <button data-cat="shoes" class="wardrobe-tab flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap text-gray-600 dark:text-gray-300 hover:bg-white/50">
                    <i class="fas fa-shoe-prints"></i> Обувь
                </button>
                <button data-cat="accessories" class="wardrobe-tab flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap text-gray-600 dark:text-gray-300 hover:bg-white/50">
                    <i class="fas fa-hat-wizard"></i> Аксессуары
                </button>
            </div>

            <!-- Items Selection Grid -->
            <div class="glass-panel p-4 rounded-3xl shadow-xl h-[320px] md:h-[360px] flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h3 id="categoryTitle" class="text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center gap-2">
                        <i class="fas fa-sparkles text-pink-500"></i> Выберите прическу
                    </h3>
                    <span id="itemCountBadge" class="text-xs bg-pink-100 dark:bg-pink-900/40 text-pink-600 dark:text-pink-300 font-semibold px-2.5 py-1 rounded-full">
                        4 варианта
                    </span>
                </div>

                <!-- Grid items container -->
                <div id="wardrobeGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3 overflow-y-auto pr-1 flex-1">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

        </div>

    </main>

    <footer class="w-full text-center py-3 text-xs text-gray-500 dark:text-gray-400">
        Готово для GitHub Pages • Сделано с любовью 💖
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 z-50 glass-panel px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-pink-300/50">
        <span id="toastIcon" class="text-xl">✨</span>
        <span id="toastText" class="text-xs font-bold text-gray-800 dark:text-gray-100">Образ успешно сохранен!</span>
    </div>

    <script>
        /* ===================================================================
           1. Web Audio API Cute Sound Synthesizer
           =================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                
                osc.frequency.setValueAtTime(580, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playSparkle() {
                if (this.muted) return;
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);

                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.06);
                    osc.stop(this.ctx.currentTime + idx * 0.06 + 0.2);
                });
            }
        }

        const sounds = new SoundEngine();

        /* ===================================================================
           2. Wardrobe Catalog & SVG Asset Definitions
           =================================================================== */
        const wardrobeData = {
            hair: [
                { id: 0, name: 'Хвостики', icon: '🎀', svg: '<path d="M110 110 C90 100 80 70 95 50 C105 35 120 40 125 50 C130 35 145 35 155 50 C170 70 160 100 140 110 Z" fill="#E06D53"/><circle cx="85" cy="45" r="12" fill="#FF758C"/><circle cx="165" cy="45" r="12" fill="#FF758C"/><path d="M85 55 L75 80 M165 55 L175 80" stroke="#E06D53" stroke-width="8" stroke-linecap="round"/>' },
                { id: 1, name: 'Длинные блонд', icon: '👱‍♀️', svg: '<path d="M100 100 C80 80 85 45 125 45 C165 45 170 80 150 100 C175 150 185 240 165 260 C150 275 140 250 145 210 C130 230 120 230 105 210 C110 250 100 275 85 260 C65 240 75 150 100 100 Z" fill="#F4D06F"/><path d="M100 45 C125 35 150 45 155 50 C140 40 110 40 100 45 Z" fill="#F9E79F"/>' },
                { id: 2, name: 'Розовое каре', icon: '🌸', svg: '<path d="M95 105 C75 90 80 50 125 50 C170 50 175 90 155 105 C175 140 165 180 145 170 C135 165 130 150 125 150 C120 150 115 165 105 170 C85 180 75 140 95 105 Z" fill="#FF85A1"/><circle cx="150" cy="55" r="10" fill="#FFAFCC"/>' },
                { id: 3, name: 'Темный пучок', icon: '🌙', svg: '<circle cx="125" cy="30" r="22" fill="#2D3748"/><path d="M95 105 C75 90 80 50 125 50 C170 50 175 90 155 105 C165 125 155 140 140 135 C130 130 125 115 125 115 C125 115 120 130 110 135 C95 140 85 125 95 105 Z" fill="#2D3748"/>' }
            ],
            tops: [
                { id: 0, name: 'Каваи Худи', icon: '🧥', svg: '<path d="M85 215 L105 185 L145 185 L165 215 L190 230 L170 255 L155 235 L155 295 L95 295 L95 235 L80 255 L60 230 Z" fill="#B5E2FA"/><circle cx="125" cy="225" r="14" fill="#FFFFFF"/><text x="120" y="230" font-size="14">💖</text>' },
                { id: 1, name: 'Топ с сердцем', icon: '👕', svg: '<path d="M95 185 L155 185 L165 235 L135 240 L125 220 L115 240 L85 235 Z" fill="#FFB7B2"/><path d="M125 205 C120 200 115 208 125 216 C135 208 130 200 125 205 Z" fill="#FF5964"/>' },
                { id: 2, name: 'Матроска', icon: '⚓', svg: '<path d="M85 185 L165 185 L175 245 L155 245 L155 295 L95 295 L95 245 L75 245 Z" fill="#FFFFFF"/><polygon points="85,185 165,185 150,225 100,225" fill="#3B82F6"/><path d="M110 185 L125 210 L140 185" fill="none" stroke="#FFFFFF" stroke-width="3"/>' },
                { id: 3, name: 'Пастельное платье', icon: '👗', svg: '<path d="M95 185 L155 185 L175 325 L75 325 Z" fill="#E4C1F9"/><path d="M95 185 L125 215 L155 185" fill="#D7B3EE"/><circle cx="125" cy="260" r="8" fill="#FFFFFF"/><circle cx="110" cy="285" r="6" fill="#FFFFFF"/><circle cx="140" cy="285" r="6" fill="#FFFFFF"/>' }
            ],
            bottoms: [
                { id: 0, name: 'Плиссированная юбка', icon: '🩱', svg: '<path d="M95 295 L155 295 L165 345 L85 345 Z" fill="#3B82F6"/><line x1="110" y1="295" x2="105" y2="345" stroke="#2563EB" stroke-width="2"/><line x1="125" y1="295" x2="125" y2="345" stroke="#2563EB" stroke-width="2"/><line x1="140" y1="295" x2="145" y2="345" stroke="#2563EB" stroke-width="2"/>' },
                { id: 1, name: 'Милые шортики', icon: '🩳', svg: '<path d="M95 295 L155 295 L155 350 L135 350 L125 325 L115 350 L95 350 Z" fill="#FFD1DC"/>' },
                { id: 2, name: 'Розовая юбочка', icon: '🩰', svg: '<path d="M90 295 L160 295 L170 340 C170 350 80 350 80 340 Z" fill="#FF85A1"/><path d="M85 315 L165 315" stroke="#FFAFCC" stroke-width="3" stroke-dasharray="4,4"/>' },
                { id: 3, name: 'Дин. брюки', icon: '👖', svg: '<path d="M98 295 L152 295 L155 365 L138 365 L128 335 L122 335 L112 365 L95 365 Z" fill="#60A5FA"/>' }
            ],
            shoes: [
                { id: 0, name: 'Белые кеды', icon: '👟', svg: '<path d="M93 365 L118 365 L118 380 L90 380 C87 380 87 370 93 365 Z" fill="#FFFFFF"/><path d="M132 365 L157 365 C163 370 163 380 160 380 L132 380 Z" fill="#FFFFFF"/><circle cx="100" cy="372" r="3" fill="#E11D48"/><circle cx="150" cy="372" r="3" fill="#E11D48"/>' },
                { id: 1, name: 'Розовые туфельки', icon: '🥿', svg: '<path d="M90 370 L118 370 L118 382 L88 382 C85 382 85 370 90 370 Z" fill="#FF758C"/><path d="M132 370 L160 370 C165 370 165 382 162 382 L132 382 Z" fill="#FF758C"/><path d="M98 370 L110 364" stroke="#FF758C" stroke-width="2"/><path d="M142 370 L154 364" stroke="#FF758C" stroke-width="2"/>' },
                { id: 2, name: 'Милые ботинки', icon: '🥾', svg: '<path d="M88 360 L118 360 L118 382 L85 382 Z" fill="#9A3412"/><path d="M132 360 L162 360 L165 382 L132 382 Z" fill="#9A3412"/>' },
                { id: 3, name: 'Тапочки лапки', icon: '🐾', svg: '<ellipse cx="103" cy="373" rx="15" ry="9" fill="#FDE047"/><ellipse cx="147" cy="373" rx="15" ry="9" fill="#FDE047"/>' }
            ],
            accessories: [
                { id: 0, name: 'Кошачьи ушки', icon: '🐱', svg: '<polygon points="95,45 110,15 125,40" fill="#2D3748"/><polygon points="125,40 140,15 155,45" fill="#2D3748"/><polygon points="100,40 110,23 118,37" fill="#FEB2B2"/><polygon points="132,37 140,23 150,40" fill="#FEB2B2"/>' },
                { id: 1, name: 'Очки сердечки', icon: '👓', svg: '<path d="M102 75 C95 65 85 70 90 80 C95 90 108 90 112 80 Z" fill="none" stroke="#FF5964" stroke-width="3"/><path d="M138 75 C132 70 122 65 118 80 C122 90 135 90 140 80 Z" fill="none" stroke="#FF5964" stroke-width="3"/><line x1="112" y1="78" x2="138" y2="78" stroke="#FF5964" stroke-width="3"/>' },
                { id: 2, name: 'Бантик на шею', icon: '🎀', svg: '<polygon points="125,185 115,175 115,195" fill="#EF4444"/><polygon points="125,185 135,175 135,195" fill="#EF4444"/><circle cx="125" cy="185" r="4" fill="#B91C1C"/>' },
                { id: 3, name: 'Звездный ободок', icon: '⭐', svg: '<path d="M90 60 Q125 30 160 60" fill="none" stroke="#FBBF24" stroke-width="3"/><polygon points="125,32 128,40 136,40 130,45 132,53 125,48 118,53 120,45 114,40 122,40" fill="#F59E0B"/>' }
            ]
        };

        let currentOutfit = {
            hair: 0,
            tops: 0,
            bottoms: 0,
            shoes: 0,
            accessories: 0
        };

        let activeCategory = 'hair';

        /* ===================================================================
           3. Avatar Rendering Engine
           =================================================================== */
        const avatarCanvas = document.getElementById('avatarCanvas');

        function renderAvatar() {
            // Base doll SVG structure (Chibi character base)
            let svgContent = `
                <!-- Background aura -->
                <circle cx="125" cy="200" r="110" fill="rgba(255, 255, 255, 0.4)" />
                
                <!-- Character Body Base -->
                <!-- Legs -->
                <rect x="108" y="320" width="12" height="50" rx="6" fill="#FEE2E7"/>
                <rect x="130" y="320" width="12" height="50" rx="6" fill="#FEE2E7"/>
                
                <!-- Shoes Layer -->
                ${wardrobeData.shoes[currentOutfit.shoes].svg}

                <!-- Torso / Skin -->
                <path d="M100 170 C100 160 150 160 150 170 L155 295 L95 295 Z" fill="#FEE2E7"/>

                <!-- Bottoms Layer -->
                ${wardrobeData.bottoms[currentOutfit.bottoms].svg}

                <!-- Tops Layer -->
                ${wardrobeData.tops[currentOutfit.tops].svg}

                <!-- Hands -->
                <circle cx="88" cy="210" r="9" fill="#FEE2E7"/>
                <circle cx="162" cy="210" r="9" fill="#FEE2E7"/>

                <!-- Head / Face -->
                <circle cx="125" cy="115" r="42" fill="#FEE2E7"/>

                <!-- Hair Back/Base if needed -->

                <!-- Eyes -->
                <ellipse cx="112" cy="115" rx="5" ry="7" fill="#2D3748"/>
                <ellipse cx="138" cy="115" rx="5" ry="7" fill="#2D3748"/>
                <circle cx="110" cy="113" r="2" fill="#FFFFFF"/>
                <circle cx="136" cy="113" r="2" fill="#FFFFFF"/>

                <!-- Blush -->
                <ellipse cx="103" cy="125" rx="6" ry="3" fill="rgba(255, 117, 140, 0.4)"/>
                <ellipse cx="147" cy="125" rx="6" ry="3" fill="rgba(255, 117, 140, 0.4)"/>

                <!-- Mouth -->
                <path d="M122 124 Q125 128 128 124" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>

                <!-- Hair Layer -->
                ${wardrobeData.hair[currentOutfit.hair].svg}

                <!-- Accessories Layer -->
                ${wardrobeData.accessories[currentOutfit.accessories].svg}
            `;

            avatarCanvas.innerHTML = svgContent;
        }

        /* ===================================================================
           4. Wardrobe UI Builder & Handlers
           =================================================================== */
        const categoryTitles = {
            hair: 'Выберите прическу',
            tops: 'Выберите верх / платьице',
            bottoms: 'Выберите юбку / штаны',
            shoes: 'Выберите обувь',
            accessories: 'Выберите аксессуар'
        };

        const wardrobeGrid = document.getElementById('wardrobeGrid');
        const categoryTitle = document.getElementById('categoryTitle');
        const itemCountBadge = document.getElementById('itemCountBadge');

        function renderWardrobeGrid() {
            const items = wardrobeData[activeCategory];
            wardrobeGrid.innerHTML = '';
            categoryTitle.innerHTML = `<i class="fas fa-sparkles text-pink-500"></i> ${categoryTitles[activeCategory]}`;
            itemCountBadge.textContent = `${items.length} вар.`;

            items.forEach((item) => {
                const isSelected = currentOutfit[activeCategory] === item.id;
                const card = document.createElement('button');
                card.className = `item-card p-3 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 transition cursor-pointer ${
                    isSelected 
                        ? 'border-pink-500 bg-pink-500/10 shadow-md' 
                        : 'border-white/60 dark:border-gray-700/60 bg-white/50 dark:bg-gray-800/50 hover:bg-white/80 dark:hover:bg-gray-800'
                }`;

                card.innerHTML = `
                    <div class="text-3xl">${item.icon}</div>
                    <span class="text-xs font-semibold text-gray-700 dark:text-gray-300 text-center">${item.name}</span>
                `;

                card.addEventListener('click', () => {
                    currentOutfit[activeCategory] = item.id;
                    sounds.playPop();
                    renderAvatar();
                    renderWardrobeGrid();
                });

                wardrobeGrid.appendChild(card);
            });
        }

        // Tab Switching
        document.querySelectorAll('.wardrobe-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.wardrobe-tab').forEach(t => {
                    t.className = 'wardrobe-tab flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap text-gray-600 dark:text-gray-300 hover:bg-white/50';
                });
                const btn = e.currentTarget;
                btn.className = 'wardrobe-tab active flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 whitespace-nowrap';
                activeCategory = btn.dataset.cat;
                sounds.playPop();
                renderWardrobeGrid();
            });
        });

        /* ===================================================================
           5. Controls & Action Handlers
           =================================================================== */
        const randomizeBtn = document.getElementById('randomizeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');

        function showToast(text, icon = '✨') {
            document.getElementById('toastIcon').textContent = icon;
            toastText.textContent = text;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        randomizeBtn.addEventListener('click', () => {
            currentOutfit.hair = Math.floor(Math.random() * wardrobeData.hair.length);
            currentOutfit.tops = Math.floor(Math.random() * wardrobeData.tops.length);
            currentOutfit.bottoms = Math.floor(Math.random() * wardrobeData.bottoms.length);
            currentOutfit.shoes = Math.floor(Math.random() * wardrobeData.shoes.length);
            currentOutfit.accessories = Math.floor(Math.random() * wardrobeData.accessories.length);
            
            sounds.playSparkle();
            renderAvatar();
            renderWardrobeGrid();
            showToast('Случайный образ создан!', '🎉');
        });

        resetBtn.addEventListener('click', () => {
            currentOutfit = { hair: 0, tops: 0, bottoms: 0, shoes: 0, accessories: 0 };
            sounds.playPop();
            renderAvatar();
            renderWardrobeGrid();
            showToast('Гардероб сброшен!', '🔄');
        });

        saveBtn.addEventListener('click', () => {
            sounds.playSparkle();
            showToast('Образ успешно сохранен в память!', '💖');
        });

        // Theme Toggle
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').className = isDark ? 'fas fa-sun text-amber-400 text-base' : 'fas fa-moon text-base';
            localStorage.setItem('dressup_theme', isDark ? 'dark' : 'light');
        });

        // Sound Toggle
        soundToggleBtn.addEventListener('click', () => {
            sounds.muted = !sounds.muted;
            document.getElementById('soundIcon').className = sounds.muted ? 'fas fa-volume-mute text-red-400 text-base' : 'fas fa-volume-up text-base';
        });

        // Init Theme from Local Storage
        if (localStorage.getItem('dressup_theme') === 'dark' || 
            (!localStorage.getItem('dressup_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fas fa-sun text-amber-400 text-base';
        }

        /* ===================================================================
           6. Application Initialization
           =================================================================== */
        window.onload = function() {
            renderAvatar();
            renderWardrobeGrid();
        };
    </script>
</body>
</html>
